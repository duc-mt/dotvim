repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: vint
        name: Vimscript Lint (vint)
        entry: bash scripts/run-vint.sh
        language: system
        types: [file]
        files: \.vim$
        pass_filenames: false

      - id: ftplugin-hygiene
        name: ftplugin Hygiene Check
        entry: bash scripts/check-ftplugin-hygiene.sh
        language: system
        files: ^ftplugin/
        pass_filenames: false

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        name: ShellCheck
        types: [shell]
        files: ^scripts/
